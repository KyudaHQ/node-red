<script type="text/javascript">
    RED.nodes.registerType('salesforce-operation', {
      category: 'salesforce',
      color: "#fff",
      defaults: {
        salesforce: { type: 'salesforce-config', required: true },
        operation: { value: 'query' },
        sobject: { value: '' },
        extname: { value: '' },
        maxfetch: { value: '' },
        name: { value: '' }
      },
      inputs: 1,
      outputs: 1,
      icon: 'salesforce.png',
      label: function () {
        var salesforceNode = RED.nodes.node(this.salesforce);
        return this.name || 'Salesforce Operation';
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      paletteLabel: 'operation',
      oneditprepare: function () {
        var extel = $(".input-extname-row");
        var sobjel = $(".input-sobject-row");
        var maxfetchel = $(".input-maxfetch-row");

        function toggleFields() {
          var id = $("#node-input-operation option:selected").val();
          if (id === 'query') {
            extel.hide();
            sobjel.hide();
            maxfetchel.show();
          } else if (id === 'upsert') {
            extel.show();
            sobjel.show();
            maxfetchel.hide();
          } else if (id === 'search' || id === 'describeglobal') {
            extel.hide();
            sobjel.hide();
            maxfetchel.hide();
          } else if (id === 'retrieve' || id === 'describe') {
            extel.hide();
            sobjel.show();
            maxfetchel.hide();
          } else {
            extel.hide();
            sobjel.show();
            maxfetchel.hide();
          }
        }

        toggleFields();
        $("#node-input-operation").change(toggleFields);
      }
    });
  </script>

  <script type="text/x-red" data-template-name="salesforce-operation">
    <div class="form-row">
      <label for="node-input-salesforce"><i class="fa fa-user"></i> User</label>
      <input type="text" id="node-input-salesforce">
    </div>
    <div class="form-row">
      <label for="node-input-operation"><i class="fa fa-wrench"></i> Operation</label>
      <select type="text" id="node-input-operation">
        <option value="query">Query</option>
        <option value="search">Search</option>
        <option value="create">Create</option>
        <option value="update">Update</option>
        <option value="upsert">Upsert</option>
        <option value="delete">Delete</option>
        <option value="retrieve">Retrieve</option>
        <option value="describe">Describe</option>
        <option value="describeglobal">Describe Global</option>
      </select>
    </div>
    <div class="form-row input-sobject-row hidden">
      <label for="node-input-sobject"><i class="fa fa-table"></i> sObject</label>
      <input type="text" id="node-input-sobject" placeholder="sObject">
    </div>
    <div class="form-row input-extname-row hidden">
      <label for="node-input-extname"><i class="fa fa-table"></i> ExtID Field</label>
      <input type="text" id="node-input-extname" placeholder="ExtID Field">
    </div>
    <div class="form-row input-maxfetch-row hidden">
      <label for="node-input-maxfetch"><i class="fa fa-table"></i> MaxFetch</label>
      <input type="text" id="node-input-maxfetch" placeholder="MaxFetch">
    </div>
  
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-input-name" placeholder="Name">
    </div>
  </script>
  
  <script type="text/x-red" data-help-name="salesforce-operation" data-lang="en-US">
      <p>Perform Salesforce data operations with JSforce. Select the API action from <code>Operation</code> and supply any required inputs via the edit dialog or message properties.</p>

      <h3>Supported operations</h3>
      <ul>
        <li><strong>Query</strong> – run SOQL from <code>msg.payload</code>; set <code>MaxFetch</code> to limit results.</li>
        <li><strong>Search</strong> – run SOSL from <code>msg.payload</code>; returns matching records.</li>
        <li><strong>Create</strong>, <strong>Update</strong>, <strong>Upsert</strong>, <strong>Delete</strong> – mutate records in the selected sObject. Provide the payload as an object or array.</li>
        <li><strong>Retrieve</strong> – load records by Id (string or array) for the selected sObject.</li>
        <li><strong>Describe</strong> – return metadata for the selected sObject.</li>
        <li><strong>Describe Global</strong> – return the org-wide describe result.</li>
      </ul>

      <h3>Message properties</h3>
      <dl class="message-properties">
        <dt class="optional">payload <span class="property-type">string | array | object</span></dt>
        <dd>SOQL/SOSL text or record data/Ids depending on the selected operation.</dd>
        <dt class="optional">sobject <span class="property-type">string</span></dt>
        <dd>Overrides the configured sObject API name.</dd>
        <dt class="optional">extname <span class="property-type">string</span></dt>
        <dd>External Id field used for upsert.</dd>
      </dl>

      <h3>Outputs</h3>
      <p>The node writes the API result to <code>msg.payload</code>. For SOQL and SOSL operations, metadata (total size, matches, etc.) is provided in <code>msg.sfResponse</code>.</p>
  </script>
